<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançamento Exclusivo - Produto Fake</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #1a202c;
        }
        p {
            color: #4a5568;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            margin-bottom: 15px;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-primary {
            background-color: #2563eb;
            color: white;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
        .form-group {
            margin-top: 25px;
            text-align: left;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #4a5568;
        }
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .btn-secondary {
            background-color: #10b981;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #059669;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #2563eb;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sua Plataforma do Futuro</h1>
        <p>Demonstração prática de coleta de métricas em tempo real para o curso.</p>

        <button id="btn-comprar" class="btn btn-primary">🔥 Garanta sua Vaga</button>

        <form id="form-lead" class="form-group">
            <label for="email">Receber Notificações</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
            <button type="submit" class="btn btn-secondary">Cadastrar na List (Lead)</button>
        </form>

        <div id="status" class="status-msg">Enviando dados para a planilha...</div>
    </div>

    <script>
        // COLE AQUI A URL GERADA NA IMPLANTAÇÃO DO SEU GOOGLE APPS SCRIPT
        const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwws26BDS6RqAmSv_85VhggOUvCLSL4n_Df73D7Vm4mh8ba8gJDSvZKJGGhIoglYehT/exec';

        const statusElement = document.getElementById('status');

        function exibirStatus(mensagem) {
            statusElement.innerText = mensagem;
            statusElement.style.display = 'block';
            setTimeout(() => {
                statusElement.style.display = 'none';
            }, 3000);
        }

        // Função genérica para enviar eventos ao Google Sheets
        function enviarEvento(nomeEvento, dadosAdicionais = '') {
            exibirStatus("Gravando evento no banco...");

            const payload = {
                evento: nomeEvento,
                dispositivo: navigator.userAgent.includes("Mobile") ? "Mobile" : "Desktop",
                origem: window.location.href,
                detalhe: dadosAdicionais
            };

            fetch(WEBHOOK_URL, {
                method: 'POST',
                mode: 'no-cors', // Evita bloqueios de CORS no navegador
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                exibirStatus("✔ Evento gravado na planilha!");
            })
            .catch(err => {
                console.error("Erro ao enviar dados:", err);
                exibirStatus("✖ Erro ao registrar evento.");
            });
        }

        // Event Listener do Botão de Compra
        document.getElementById('btn-comprar').addEventListener('click', function() {
            enviarEvento('clique_comprar', 'CTA Principal');
        });

        // Event Listener do Formulário
        document.getElementById('form-lead').addEventListener('submit', function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email').value;
            enviarEvento('conversao_lead', emailInput);
            document.getElementById('email').value = '';
        });
    </script>
</body>
</html>
