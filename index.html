<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançamento Exclusivo - Coleta Completa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; width: 100%; text-align: center; }
        .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-main { background: #2563eb; color: white; }
        .btn-sub { background: #10b981; color: white; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; }
        #status { margin-top: 15px; font-size: 0.85rem; color: #2563eb; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Plataforma de Demonstração</h2>
        <p style="margin: 10px 0; color: #666; font-size: 0.9rem;">Interaja para enviar telemetria completa para a planilha.</p>
        
        <button id="btn-comprar" class="btn btn-main">🔥 Garanta sua Vaga</button>

        <form id="form-lead" style="margin-top: 20px;">
            <input type="email" id="email" placeholder="seu@email.com" required>
            <button type="submit" class="btn btn-sub">Cadastrar Lead</button>
        </form>

        <div id="status">Enviando dados...</div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://script.google.com/macros/s/SUA_URL_DO_APPS_SCRIPT_AQUI/exec';
        
        // Cronômetro para medir o tempo na página antes da conversão
        const horaInicio = Date.now();

        // Extrair parâmetros UTM da URL
        const urlParams = new URLSearchParams(window.location.search);
        const utmSource = urlParams.get('utm_source') || 'Direto/Nenhum';
        const utmMedium = urlParams.get('utm_medium') || 'Nenhum';

        function extrairSO() {
            const ua = navigator.userAgent;
            if (ua.includes("Win")) return "Windows";
            if (ua.includes("Mac")) return "MacOS";
            if (ua.includes("Android")) return "Android";
            if (ua.includes("iPhone") || ua.includes("iPad")) return "iOS";
            return "Outro";
        }

        function extrairNavegador() {
            const ua = navigator.userAgent;
            if (ua.includes("Chrome") && !ua.includes("Edg")) return "Chrome";
            if (ua.includes("Safari") && !ua.includes("Chrome")) return "Safari";
            if (ua.includes("Firefox")) return "Firefox";
            if (ua.includes("Edg")) return "Edge";
            return "Outro";
        }

        function exibirStatus(msg) {
            const st = document.getElementById('status');
            st.innerText = msg;
            st.style.display = 'block';
            setTimeout(() => st.style.display = 'none', 3000);
        }

        async function enviarEvento(nomeEvento, detalhe = '') {
            exibirStatus("Obtendo dados de rede e bateria...");

            // Dados de Geolocalização via IP (API Externa Gratuita)
            let geo = { ip: 'N/A', city: 'N/A', region: 'N/A', country_name: 'N/A', org: 'N/A' };
            try {
                const res = await fetch('https://ipapi.co/json/');
                if (res.ok) geo = await res.json();
            } catch(e) { console.log('Erro ao obter IP/Geo'); }

            // Dados da Bateria
            let batNivel = 'N/A';
            let batStatus = 'N/A';
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    batNivel = `${Math.round(battery.level * 100)}%`;
                    batStatus = battery.charging ? 'Carregando' : 'Desconectado';
                } catch(e) {}
            }

            const tempoNaPagina = ((Date.now() - horaInicio) / 1000).toFixed(1);

            const payload = {
                evento: nomeEvento,
                detalhe: detalhe,
                dispositivo: /Mobi|Android/i.test(navigator.userAgent) ? "Mobile" : "Desktop",
                so: extrairSO(),
                navegador: extrairNavegador(),
                resolucao: `${window.screen.width}x${window.screen.height}`,
                orientacao: screen.orientation ? screen.orientation.type : 'N/A',
                idioma: navigator.language || navigator.userLanguage,
                ip: geo.ip,
                cidade: geo.city,
                estado: geo.region,
                pais: geo.country_name,
                isp: geo.org,
                pagina: window.location.href,
                referrer: document.referrer || "Acesso Direto",
                utmSource: utmSource,
                utmMedium: utmMedium,
                tempoSegundos: tempoNaPagina,
                bateriaNivel: batNivel,
                bateriaStatus: batStatus
            };

            fetch(WEBHOOK_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => exibirStatus("✔ Dados gravados com sucesso!"))
            .catch(() => exibirStatus("✖ Erro ao registrar dados."));
        }

        document.getElementById('btn-comprar').addEventListener('click', () => {
            enviarEvento('clique_comprar', 'CTA Principal');
        });

        document.getElementById('form-lead').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            enviarEvento('conversao_lead', email);
            document.getElementById('email').value = '';
        });
    </script>
</body>
</html>
